      /* ---- Critical CSS: Above-the-fold content ---- */
      :root {
        --font-display: 'Cormorant', Georgia, serif;
        --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, monospace;
        --bg-primary: #0B0B09;
        --bg-surface: #131310;
        --bg-card: #1A1A16;
        --text-primary: #F0E6C8;
        --text-secondary: #A89C7C;
        --text-muted: #5A5A48;
        --accent-gold: #C9A84C;
        --accent-gold-dim: #8B7234;
        --border-zinc: #3A3A30;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        font-size: 0.9375rem;
        line-height: 1.65;
        color: var(--text-primary);
        background: var(--bg-primary);
        min-height: 100vh;
      }
      .roman-eyebrow {
        font-size: 0.625rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--accent-gold);
        font-family: var(--font-body);
      }
      .hero-section {
        position: relative;
        border: 1px solid var(--border-zinc);
        border-radius: 24px;
        background: var(--bg-surface);
        overflow: hidden;
      }
      .hero-section > * { position: relative; z-index: 1; }
      .btn-roman {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        border: 1px solid var(--border-zinc);
        background: var(--bg-card);
        color: var(--text-primary);
        transition: all 0.2s;
      }
      .btn-roman:hover {
        border-color: var(--accent-gold);
        color: var(--accent-gold);
      }
      .btn-roman-primary {
        background: var(--accent-gold);
        border-color: var(--accent-gold);
        color: var(--text-inverse);
      }
      .btn-roman-primary:hover {
        background: var(--accent-gold-light);
        border-color: var(--accent-gold-light);
      }
      /* ---- Skip link for accessibility ---- */
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: var(--accent-gold);
        color: var(--text-inverse);
        padding: 0.5rem 1rem;
        z-index: 1000;
        transition: top 0.3s;
      }
      .skip-link:focus {
        top: 0;
      }
